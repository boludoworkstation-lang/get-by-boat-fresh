name: Deploy Get By Boat to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check source and auth flows
        run: npm run check
      - name: Check Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Set repository secret CLOUDFLARE_API_TOKEN before deploying."
            exit 1
          fi
      - name: Bundle live marketplace into main script
        run: node -e "const fs=require('fs');fs.appendFileSync('public/app.js','\n'+fs.readFileSync('public/backend.js','utf8'))"
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '618e03f70463c5af619e602eafbe1511'
          command: deploy
